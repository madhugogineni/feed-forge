[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feed-forge"
version = "0.1.0"
description = "Human-in-the-loop X growth research pipeline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
feed-forge = "feed_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
