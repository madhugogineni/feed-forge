name: Account discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Discover accounts
        run: >-
          python scripts/discover_accounts.py
          --github-summary
          --json-output artifacts/account-discovery.json
          --markdown-output artifacts/account-discovery.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-discovery-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
