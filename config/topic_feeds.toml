schema_version = 1

[collection]
timezone = "Asia/Kolkata"
max_age_hours = 168
max_items_per_feed = 200
max_items_per_topic = 8
timeout_seconds = 20
max_feed_bytes = 3000000

# This is an ingestion watchlist, not a set of X search terms. A story can
# appear under several topics. The report shows matched terms for review.
[[topics]]
id = "ai_development"
label = "AI development and products"
lane = "review"
match_any = ["artificial intelligence", "generative ai", "AI model", "large language model", "LLM", "OpenAI", "Anthropic", "Gemini", "Claude", "AI coding", "AI developer", "AI product"]
feed_ids = ["openai", "nvidia_developer"]

[[topics]]
id = "big_tech"
label = "Major technology companies"
lane = "review"
match_any = ["Google", "Nvidia", "Apple", "Samsung", "Xiaomi", "Tesla", "Microsoft", "Meta", "Amazon", "Adobe", "Spotify", "YouTube", "OnePlus", "Jio", "Airtel"]
feed_ids = ["google_india", "nvidia", "samsung", "apple_india"]

[[topics]]
id = "indian_brands"
label = "Indian consumer brands and products"
lane = "review"
show_term_counts = true
diversify_by_terms = true
match_any = ["Frido", "boAt", "Noise smartwatch", "Noise earbuds", "Noise wearables", "Mokobara", "The Sleep Company", "Wakefit", "Lenskart", "The Souled Store", "Minimalist skincare", "Be Minimalist", "Mamaearth", "CRED", "Zepto", "Blinkit", "Swiggy", "Zomato", "Urban Company", "Nykaa", "Atomberg", "Ather", "Ola Electric"]
case_sensitive = ["boAt", "CRED"]
feed_ids = []

[[topics]]
id = "tech_software"
label = "Technology, software and gadgets"
lane = "review"
match_any = ["software", "app update", "operating system", "Android", "iOS", "iPhone", "Pixel", "laptop", "smartphone", "wearable", "browser", "developer tool", "open source"]
feed_ids = []

[[topics]]
id = "music_apps"
label = "Music and streaming apps"
lane = "review"
match_any = ["Apple Music", "YouTube Music", "Spotify", "Amazon Music", "music streaming", "music app"]
feed_ids = []

[[topics]]
id = "credit_cards_payments"
label = "Credit cards, rewards and payments"
lane = "review"
match_any = ["credit card", "card rewards", "reward points", "cashback", "airport lounge", "UPI", "payment app", "digital payments", "RBI card"]
feed_ids = ["cardinsider"]

[[topics]]
id = "india_developments"
label = "India developments"
lane = "review"
match_any = ["India", "Indian", "Bharat", "central government"]
feed_ids = ["indian_express_india"]

[[topics]]
id = "telangana_hyderabad"
label = "Telangana and Hyderabad developments"
lane = "review"
match_any = ["Telangana", "Hyderabad", "Secunderabad", "Cyberabad", "GHMC", "HMDA", "Hyderabad Metro", "Patancheru", "Sangareddy", "Warangal"]
feed_ids = ["indian_express_hyderabad", "hindu_telangana", "hindu_hyderabad"]

[[topics]]
id = "local_practical"
label = "Practical local updates"
lane = "review"
match_all = ["Telangana|Hyderabad|Secunderabad|Cyberabad|Patancheru|Sangareddy|Warangal|GHMC|HMDA", "weather alert|heavy rain|flood|heatwave|traffic diversion|road closure|metro disruption|power cut|water supply|commute|airport disruption"]
match_any = []
feed_ids = []

[[topics]]
id = "india_geopolitics"
label = "India-related geopolitics"
lane = "context_only"
match_all = ["India|Indian|New Delhi|MEA", "diplomacy|foreign policy|bilateral|border|trade talks|summit|sanctions|geopolitic|treaty|ambassador"]
match_any = []
feed_ids = []

[[topics]]
id = "crime"
label = "Crime news"
lane = "context_only"
match_any = ["crime", "arrest", "police investigation", "murder", "robbery", "fraud", "scam", "trafficking", "cybercrime"]
feed_ids = ["telangana_today_crime"]

[[topics]]
id = "consumer_safety"
label = "Consumer and digital safety"
lane = "review"
match_any = ["scam", "phishing", "data breach", "payment fraud", "UPI fraud", "security advisory", "vulnerability", "recall", "cyber attack", "cyberattack", "ransomware"]
feed_ids = []

[[topics]]
id = "travel_lifestyle"
label = "Travel and lifestyle"
lane = "review"
match_any = ["visa", "airline", "airport", "travel", "hotel booking", "tourism", "trip planning"]
feed_ids = []

[[topics]]
id = "fitness_ergonomics"
label = "Fitness and ergonomics"
lane = "review"
match_any = ["fitness", "workout", "running shoes", "running training", "marathon", "nutrition", "ergonomic", "posture", "wellness", "health tech"]
feed_ids = []

[[topics]]
id = "personal_finance"
label = "Personal finance and investing"
lane = "review"
match_any = ["personal finance", "investing", "mutual fund", "income tax", "money lesson", "savings account"]
feed_ids = []

